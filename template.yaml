AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  LinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
          - AttributeName: code
            AttributeType: S
      KeySchema:
          - AttributeName: code 
            KeyType: HASH 
      BillingMode: PAY_PER_REQUEST    
  CounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
      KeySchema:
          - AttributeName: id 
            KeyType: HASH 
      BillingMode: PAY_PER_REQUEST
  LambdaHandler:
    Type: AWS::Serverless::Function
    Properties:
      Events:
        ShortenUrl:
          Type: HttpApi
          Properties:
            Path: /shorten
            Method: post
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      CodeUri: src/shorten/
      Environment:
        Variables:
          LINKS_TABLE_NAME: !Ref LinksTable
          COUNTER_TABLE_NAME: !Ref CounterTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref LinksTable
        - DynamoDBWritePolicy:
            TableName: !Ref CounterTable